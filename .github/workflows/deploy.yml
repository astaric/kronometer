name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H cp-54.controlpanel.si >> ~/.ssh/known_hosts

      - name: Pull and deploy
        run: |
          ssh -i ~/.ssh/id_deploy naring85@cp-54.controlpanel.si \
            'cd ~/repositories/kronometer && git pull --ff-only && /usr/local/cpanel/bin/uapi VersionControlDeployment create repository_root=$PWD'
